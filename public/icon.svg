<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF7F" />
      <stop offset="100%" stop-color="#008080" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008080" />
      <stop offset="100%" stop-color="#87CEEB" />
    </linearGradient>
    <linearGradient id="grad3" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="100%" stop-color="#00FFFF" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#00FF7F" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <rect width="512" height="512" fill="#1A202C" rx="112" />
  
  <g transform="translate(256, 256) scale(0.8)" filter="url(#shadow)">
    <!-- Top Left to Bottom Left -->
    <path d="M -120 -120 C -180 -60, -180 60, -120 120 L -60 60 C -90 30, -90 -30, -60 -60 Z" fill="url(#grad1)" />
    <!-- Bottom Left to Bottom Right -->
    <path d="M -120 120 C -60 180, 60 180, 120 120 L 60 60 C 30 90, -30 90, -60 60 Z" fill="url(#grad2)" />
    <!-- Bottom Right to Top Right -->
    <path d="M 120 120 C 180 60, 180 -60, 120 -120 L 60 -60 C 90 -30, 90 30, 60 60 Z" fill="url(#grad3)" />
    <!-- Top Right to Top Left -->
    <path d="M 120 -120 C 60 -180, -60 -180, -120 -120 L -60 -60 C -30 -90, 30 -90, 60 -60 Z" fill="url(#grad4)" />
  </g>

  <!-- Clock Face (3 o'clock) -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="12" fill="#00FF7F" />
    <path d="M 0 -40 L 0 0 L 40 0" fill="none" stroke="#00FF7F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
